# CodeWarrior for ARM, run through wine by tools/mwcc.sh. The compiler build
# is selected with the MWCC_VERSION environment variable (default 2.0/sp2,
# the same default as the `mwcc_version` option and tools/match.py).
[constants]
toolchain = '@GLOBAL_SOURCE_ROOT@' / 'tools'

[binaries]
c      = [toolchain / 'mwcc.sh']
c_ld   = [toolchain / 'mwld.sh']
ar     = [toolchain / 'mwld.sh']
nasm   = [toolchain / 'mwasm.sh']
strip  = ['false']

[host_machine]
system     = 'bare metal'
cpu_family = 'arm'
cpu        = 'arm'
endian     = 'little'
